<!-- Error Template - Returned by HTMX on errors -->
<div class="bg-red-50 border border-red-200 rounded-lg p-6">
    <div class="flex items-center">
        <svg class="h-8 w-8 text-red-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <div>
            <h3 class="text-lg font-medium text-red-800">Analysis Failed</h3>
            <p class="text-red-600 mt-1">{{ error }}</p>
        </div>
    </div>
    <div class="mt-4">
        <p class="text-sm text-red-500">
            Please try again with a valid rose leaf image (JPG or PNG format).
        </p>
    </div>
</div>
